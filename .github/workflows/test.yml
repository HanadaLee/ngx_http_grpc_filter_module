name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nginx_ref:
        description: nginx branch, tag or commit
        default: 'release-1.31.8'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'HanadaLee/ngx_http_grpc_filter_module'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        expr: [enabled, disabled]
    steps:
      - name: Check out module
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out nginx
        uses: actions/checkout@v6
        with:
          repository: nginx/nginx
          ref: ${{ inputs.nginx_ref || 'release-1.31.8' }}
          path: .ci/nginx
          persist-credentials: false

      - name: Check out ngx_expr_module
        if: matrix.expr == 'enabled'
        uses: actions/checkout@v6
        with:
          repository: HanadaLee/ngx_expr_module
          ref: '1.0.1'
          path: .ci/ngx_expr_module
          persist-credentials: false

      - name: Check out nginx-tests
        uses: actions/checkout@v6
        with:
          repository: nginx/nginx-tests
          path: .ci/nginx-tests
          persist-credentials: false

      - name: Install test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libpcre2-dev libssl-dev zlib1g-dev perl

      - name: Build and test
        env:
          TEST_EXPR: ${{ matrix.expr }}
        run: bash util/run-tests.sh .ci/nginx .ci/nginx-tests .ci/ngx_expr_module
